<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job-Hunt & Company Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

            --secondary-color: #666666;

            --border-color: #e5e5e5;
            --accent-color: #0056b3;
        }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: var(--primary-color); margin: 0; padding: 0; line-height: 1.6; }
        header { background: white; padding: 40px 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 28px; font-weight: 700; margin: 0 0 10px 0; letter-spacing: 1px; }
        .description { color: var(--secondary-color); font-size: 14px; margin: 0; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .search-box { width: 100%; padding: 15px 20px; font-size: 16px; border: 1px solid var(--border-color); border-radius: 30px; box-sizing: border-box; font-family: inherit; transition: all 0.3s ease; margin-bottom: 25px; background: white; }
        .search-box:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .filter-section { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .filter-group { display: flex; align-items: flex-start; margin-bottom: 15px; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-label { font-weight: 700; font-size: 14px; width: 80px; padding-top: 8px; flex-shrink: 0; color: var(--primary-color); }
        
        .filters { display: flex; gap: 8px; flex-wrap: wrap; flex-grow: 1; }
