<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job-Hunt Prompts</title>
    <!-- 美しい日本語フォントを読み込む -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #666666;
            --bg-color: #fcfcfc;
            --border-color: #e5e5e5;
            --accent-color: #0056b3;
        }
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--primary-color); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
        }
        header {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { 
            font-size: 28px; 
            font-weight: 700; 
            margin: 0 0 10px 0; 
            letter-spacing: 1px;
        }
        .description { 
            color: var(--secondary-color); 
            font-size: 14px; 
            margin: 0; 
        }
        .container { 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }
        .controls { 
            margin-bottom: 40px; 
        }
        .search-box { 
            width: 100%; 
            padding: 15px 20px; 
            font-size: 16px; 
            border: 1px solid var(--border-color); 
            border-radius: 30px; 
            box-sizing: border-box; 
            font-family: inherit;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            background: white;
        }
        .search-box:focus { 
            border-color: var(--primary-color); 
            outline: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .filters { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        /* チェックボックスを隠してオシャレなボタンにする魔法 */
        .filters input[type="checkbox"] {
            display: none;
        }
        .filters label { 
            cursor: pointer; 
            background: white; 
            color: var(--secondary-color);
            padding: 8px 18px; 
            border-radius: 30px; 
            font-size: 13px; 
            font-weight: 500;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease; 
        }
        .filters input[type="checkbox"]:checked + label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .filters label:hover { 
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .news-list { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px; 
        }
        .news-card { 
            background: white;
            padding: 25px; 
            border: 1px solid var(--border-color); 
            text-decoration: none; 
            color: inherit; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease; 
        }
        .news-card:hover { 
            box-shadow: 0 10px 20px rgba(0,0,0,0.04); 
            transform: translateY(-3px); 
        }
        .news-title { 
            font-size: 16px; 
            margin: 0 0 20px 0; 
            font-weight: 700;
            line-height: 1.5; 
        }
        .news-meta { 
            font-size: 12px; 
            color: var(--secondary-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .tag { 
            font-weight: 500;
            color: var(--accent-color);
        }
        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--secondary-color);
            padding: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>AI Job-Hunt Prompts</h1>
    <p class="description">最新のAIプロンプトを活用して、就職活動をスマートに。</p>
</header>

<div class="container">
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="キーワードで記事を検索...">
        <div class="filters" id="checkboxContainer">
            <!-- いただいた8つのタグを配置しています -->
            <input type="checkbox" id="tag-intern" value="intern" checked><label for="tag-intern">インターン対策</label>
            <input type="checkbox" id="tag-es" value="es" checked><label for="tag-es">ES作成・添削</label>
            <input type="checkbox" id="tag-interview" value="interview" checked><label for="tag-interview">面接対策</label>
            <input type="checkbox" id="tag-gd" value="gd" checked><label for="tag-gd">GD</label>
            <input type="checkbox" id="tag-research" value="research" checked><label for="tag-research">企業研究</label>
            <input type="checkbox" id="tag-self-analysis" value="self_analysis" checked><label for="tag-self-analysis">自己分析</label>
            <input type="checkbox" id="tag-ir-news" value="ir_news" checked><label for="tag-ir-news">IR・企業ニュース要約</label>
            <input type="checkbox" id="tag-prompt" value="prompt" checked><label for="tag-prompt">有用AIプロンプト</label>
        </div>
    </div>

    <div id="newsContainer" class="news-list">
        <!-- 記事がここに表示されます -->
    </div>
</div>

<script>
    let newsData = [];

    const newsContainer = document.getElementById('newsContainer');
    const searchInput = document.getElementById('searchInput');
    const checkboxes = document.querySelectorAll('#checkboxContainer input[type="checkbox"]');

    function renderNews() {
        const searchText = searchInput.value.toLowerCase();
        const activeCategories = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

        const filteredNews = newsData.filter(news => {
            return news.title.toLowerCase().includes(searchText) && activeCategories.includes(news.category);
        });

        newsContainer.innerHTML = '';
        filteredNews.forEach(news => {
            const card = document.createElement('a');
            card.href = news.url;
            card.target = "_blank";
            card.className = 'news-card';
            card.innerHTML = `
                <h2 class="news-title">${news.title}</h2>
                <div class="news-meta">
                    <span class="tag"># ${news.categoryName}</span>
                    <span>${news.date}</span>
                </div>
            `;
            newsContainer.appendChild(card);
        });

        if(filteredNews.length === 0) {
            newsContainer.innerHTML = '<p class="empty-message">条件に一致する記事がありません。</p>';
        }
    }

    searchInput.addEventListener('input', renderNews);
    checkboxes.forEach(cb => cb.addEventListener('change', renderNews));

    fetch('news_data.json')
        .then(response => response.json())
        .then(data => {
            newsData = data;
            renderNews();
        })
        .catch(error => {
            console.error("エラー:", error);
            newsContainer.innerHTML = '<p class="empty-message">データの読み込みに失敗しました。</p>';
        });
</script>

</body>
</html>
