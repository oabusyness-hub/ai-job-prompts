<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>就活生向け AIプロンプト集</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1a365d; }
        .description { text-align: center; color: #4a5568; margin-bottom: 20px; }
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        .search-box { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; }
        .filters { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .filters label { cursor: pointer; background: #edf2f7; padding: 8px 16px; border-radius: 20px; font-size: 14px; }
        .news-list { display: grid; gap: 15px; }
        .news-card { padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; text-decoration: none; color: inherit; display: block; background: #ffffff; }
        .news-title { font-size: 18px; margin: 0 0 12px 0; color: #2b6cb0; }
        .news-meta { font-size: 13px; color: #718096; display: flex; justify-content: space-between; }
        .tag { padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .tag.es { background: #fed7d7; color: #c53030; }
        .tag.interview { background: #c3dafe; color: #434190; }
        .tag.research { background: #c6f6d5; color: #22543d; }
    </style>
</head>
<body>

<div class="container">
    <h1>就活生向け AIプロンプト集</h1>
    <p class="description">ChatGPTやClaudeを活用して、就活を有利に進めるためのプロンプトまとめ</p>
    
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="キーワードで探す...">
        <div class="filters" id="checkboxContainer">
            <label><input type="checkbox" value="es" checked> ES作成・添削</label>
            <label><input type="checkbox" value="interview" checked> 面接対策</label>
            <label><input type="checkbox" value="research" checked> 企業研究・自己分析</label>
        </div>
    </div>

    <div id="newsContainer" class="news-list"></div>
</div>

<script>
    const newsData = [
        { title: "【コピペでOK】ChatGPTに自己PRをブラッシュアップさせる最強プロンプト", category: "es", categoryName: "ES作成・添削", date: "2026-10-12", url: "#" },
        { title: "AIを模擬面接官にする方法！深掘り質問で面接対策を完璧に", category: "interview", categoryName: "面接対策", date: "2026-10-11", url: "#" },
        { title: "志望企業のIR情報をChatGPTに読み込ませて企業研究を時短するコツ", category: "research", categoryName: "企業研究・自己分析", date: "2026-10-10", url: "#" }
    ];

    const newsContainer = document.getElementById('newsContainer');
    const searchInput = document.getElementById('searchInput');
    const checkboxes = document.querySelectorAll('#checkboxContainer input[type="checkbox"]');

    function renderNews() {
        const searchText = searchInput.value.toLowerCase();
        const activeCategories = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

        const filteredNews = newsData.filter(news => {
            return news.title.toLowerCase().includes(searchText) && activeCategories.includes(news.category);
        });

        newsContainer.innerHTML = '';
        filteredNews.forEach(news => {
            const card = document.createElement('a');
            card.href = news.url;
            card.className = 'news-card';
            card.innerHTML = `
                <h2 class="news-title">${news.title}</h2>
                <div class="news-meta">
                    <span class="tag ${news.category}">${news.categoryName}</span>
                    <span>${news.date}</span>
                </div>
            `;
            newsContainer.appendChild(card);
        });
    }

    searchInput.addEventListener('input', renderNews);
    checkboxes.forEach(cb => cb.addEventListener('change', renderNews));
    renderNews();
</script>

</body>
</html>
